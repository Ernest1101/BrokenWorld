plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
}

loom {
    // the private model internals the faceless mobs need (ModelPart cubes, ...)
    accessWidenerPath = file("src/main/resources/brokenworld.accesswidener")

    runs {
        client {
            runDir "run"
            // Profiling: ./gradlew runClient -PprofileWorld=<save folder> -PjfrFile=<path.jfr>
            // opens that world straight away and records a Java Flight Recording of a minute of play.
            if (project.hasProperty('profileWorld')) {
                programArgs '--quickPlaySingleplayer', project.property('profileWorld')
                vmArg "-XX:StartFlightRecording=delay=45s,duration=60s,settings=profile,filename=${project.property('jfrFile')}"
            }
        }
        server {
            runDir "run-server"
        }
        // ./gradlew runGametest - runs all the mod's GameTests (test/FinaleGameTest.java), then exits
        gametest {
            server()
            name "Game Test"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest-report.xml"
            runDir "build/gametest"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Mojang's own names: the code reads like the game's
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // @Nullable (Forge brought it along)
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
